<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#1f2937"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M0,0 L12,6 L0,12 z" fill="#7c3aed"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="#f8fafc"/>

  <text x="800" y="58" text-anchor="middle" font-size="36" font-weight="700" fill="#0f172a">CORS Vulnerability Demo — Architecture</text>
  <text x="800" y="90" text-anchor="middle" font-size="18" fill="#475569">How a permissive Access-Control-Allow-Origin lets a malicious site read authenticated responses</text>

  <!-- ====== Victim Browser (now contains both tabs side-by-side) ====== -->
  <g filter="url(#shadow)">
    <rect x="60" y="150" width="900" height="660" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  </g>
  <text x="510" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Victim's Browser</text>
  <text x="510" y="214" text-anchor="middle" font-size="14" fill="#64748b">Two tabs open at the same time — session cookie shared by both</text>

  <!-- Tab 1: Vulnerable Crypto Trading Web -->
  <g filter="url(#shadow)">
    <rect x="80" y="250" width="360" height="520" rx="12" fill="#ecfdf5" stroke="#0ea5e9" stroke-width="2"/>
  </g>
  <rect x="80" y="250" width="160" height="32" rx="8" fill="#0ea5e9"/>
  <text x="160" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">tab 1</text>
  <text x="260" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#0c4a6e">Vulnerable Crypto</text>
  <text x="260" y="346" text-anchor="middle" font-size="20" font-weight="700" fill="#0c4a6e">Trading Web</text>
  <text x="260" y="378" text-anchor="middle" font-size="14" fill="#0c4a6e">Node.js + Express + React</text>
  <text x="260" y="420" text-anchor="middle" font-size="13" fill="#334155">Victim is already logged in;</text>
  <text x="260" y="438" text-anchor="middle" font-size="13" fill="#334155">session cookie is set</text>

  <rect x="110" y="476" width="300" height="80" rx="8" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="260" y="500" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">Misconfigured CORS</text>
  <text x="260" y="522" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7f1d1d">Access-Control-Allow-Origin: *</text>
  <text x="260" y="540" text-anchor="middle" font-size="12" font-family="Menlo, Consolas, monospace" fill="#7f1d1d">+ credentials</text>

  <text x="260" y="745" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">vulnerable-server/  •  vulnerable-frontend/</text>

  <!-- Tab 2: Phishing Site (simplified) -->
  <g filter="url(#shadow)">
    <rect x="600" y="250" width="350" height="520" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  </g>
  <rect x="600" y="250" width="160" height="32" rx="8" fill="#dc2626"/>
  <text x="680" y="271" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">tab 2</text>
  <text x="775" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#991b1b">Phishing Site</text>
  <text x="775" y="372" text-anchor="middle" font-size="13" fill="#334155">Page silently runs attacker JS</text>
  <text x="775" y="394" text-anchor="middle" font-size="13" fill="#334155">that calls the vulnerable API</text>
  <text x="775" y="416" text-anchor="middle" font-size="13" fill="#334155">with credentials and forwards</text>
  <text x="775" y="438" text-anchor="middle" font-size="13" fill="#334155">the response to the data collector</text>
  <text x="775" y="745" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">phishing-site/public/index.html</text>

  <!-- ====== Attacker scope ====== -->
  <g filter="url(#shadow)">
    <rect x="1020" y="150" width="520" height="660" rx="18" fill="#fafaf9" stroke="#1f2937" stroke-width="2.5" stroke-dasharray="8 6"/>
  </g>
  <text x="1280" y="190" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">Attacker</text>
  <text x="1280" y="214" text-anchor="middle" font-size="14" fill="#64748b">Infrastructure controlled by the adversary</text>

  <!-- Phishing email -->
  <g filter="url(#shadow)">
    <rect x="1060" y="260" width="440" height="180" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  </g>
  <text x="1280" y="298" text-anchor="middle" font-size="18" font-weight="700" fill="#7c2d12">Phishing Email</text>
  <text x="1280" y="334" text-anchor="middle" font-size="13" fill="#334155">Lures the victim to the phishing site</text>
  <text x="1280" y="412" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">phishing-site/email-template.html</text>

  <!-- Data collector -->
  <g filter="url(#shadow)">
    <rect x="1060" y="500" width="440" height="220" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
  </g>
  <text x="1280" y="540" text-anchor="middle" font-size="18" font-weight="700" fill="#4c1d95">Data Collector Server</text>
  <text x="1280" y="564" text-anchor="middle" font-size="14" fill="#4c1d95">Node.js + Express</text>
  <text x="1280" y="596" text-anchor="middle" font-size="13" fill="#334155">Receives the exfiltrated session data</text>
  <text x="1280" y="618" text-anchor="middle" font-size="13" fill="#334155">Attacker reads it via /stolen-data</text>
  <text x="1280" y="690" text-anchor="middle" font-size="12" fill="#475569" font-style="italic">data-collector-server/</text>

  <!-- ====== Numbered flow arrows ====== -->

  <!-- 1: Phishing email -> Phishing tab. Direct horizontal arrow, top area. -->
  <path d="M 1060 340 L 950 340" fill="none" stroke="#1f2937" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1005" y="328" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2937">victim opens link</text>
  <circle cx="1005" cy="362" r="14" fill="#1f2937"/>
  <text x="1005" y="367" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>

  <!-- 2: Phishing tab -> Crypto web tab (cross-origin fetch with cookie). -->
  <path d="M 600 460 L 450 460" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow-red)"/>
  <text x="520" y="438" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">cross-origin fetch</text>
  <text x="520" y="456" text-anchor="middle" font-size="11" fill="#991b1b">(cookie attached)</text>
  <circle cx="520" cy="482" r="14" fill="#dc2626"/>
  <text x="520" y="487" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>

  <!-- 3: Crypto web tab -> Phishing tab (response readable). -->
  <path d="M 440 580 L 600 580" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow-red)"/>
  <text x="520" y="610" text-anchor="middle" font-size="13" font-weight="600" fill="#991b1b">user data</text>
  <text x="520" y="628" text-anchor="middle" font-size="11" fill="#991b1b">readable by attacker JS</text>
  <circle cx="520" cy="558" r="14" fill="#dc2626"/>
  <text x="520" y="563" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>

  <!-- 4: Phishing tab -> Data Collector. -->
  <path d="M 950 600 L 1060 600" fill="none" stroke="#7c3aed" stroke-width="2.5" marker-end="url(#arrow-purple)"/>
  <text x="1005" y="588" text-anchor="middle" font-size="13" font-weight="600" fill="#4c1d95">POST stolen data</text>
  <circle cx="1005" cy="622" r="14" fill="#7c3aed"/>
  <text x="1005" y="627" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>

  <!-- ====== Fix box ====== -->
  <g filter="url(#shadow)">
    <rect x="60" y="828" width="1480" height="56" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  </g>
  <text x="80" y="862" font-size="14" font-weight="700" fill="#155e75">Fix:</text>
  <text x="125" y="862" font-size="14" fill="#0f172a">restrict Access-Control-Allow-Origin to a trusted allow-list, never combine "*" with credentials, and add CSRF protections on state-changing endpoints.</text>
</svg>
